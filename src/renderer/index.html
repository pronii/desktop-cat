<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desktop-cat</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="stage" aria-label="桌面小猫宠物">
      <canvas class="live2d-canvas" id="live2dCanvas" width="240" height="240" aria-hidden="true"></canvas>
      <button class="cat" type="button" aria-label="摸摸小猫">
        <span class="ear ear-left"></span>
        <span class="ear ear-right"></span>
        <span class="head">
          <span class="face-mark face-mark-left"></span>
          <span class="face-mark face-mark-right"></span>
          <span class="eye eye-left"></span>
          <span class="eye eye-right"></span>
          <span class="cheek cheek-left"></span>
          <span class="cheek cheek-right"></span>
          <span class="nose"></span>
          <span class="mouth"></span>
          <span class="whisker whisker-left whisker-top"></span>
          <span class="whisker whisker-left whisker-bottom"></span>
          <span class="whisker whisker-right whisker-top"></span>
          <span class="whisker whisker-right whisker-bottom"></span>
        </span>
        <span class="body">
          <span class="paw paw-left"></span>
          <span class="paw paw-right"></span>
        </span>
        <span class="tail"></span>
      </button>
      <span class="happy-bubble"></span>
    </main>

    <div class="bottom-bar">
      <div class="toolbar-primary">
        <button
          class="sketch-btn water-counter"
          id="waterCounter"
          type="button"
          aria-label="今日喝水杯数"
          aria-controls="waterPanel"
          aria-expanded="false"
          title="喝水记录"
        >
          <span class="sketch-btn-icon">
            <svg class="ui-icon" data-icon="droplet" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
              <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z" />
            </svg>
          </span>
          <span class="sketch-btn-text"><span class="water-counter-num">0</span>杯</span>
        </button>

        <button
          class="sketch-btn clipboard-btn"
          id="clipboardBtn"
          type="button"
          aria-label="打开剪贴板历史"
          aria-controls="clipboardPanel"
          aria-expanded="false"
          title="剪贴板历史"
        >
          <span class="sketch-btn-icon">
            <svg class="ui-icon" data-icon="clipboard-list" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
              <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
              <path d="M12 11h4" />
              <path d="M12 16h4" />
              <path d="M8 11h.01" />
              <path d="M8 16h.01" />
            </svg>
          </span>
          <span class="sketch-btn-text">历史</span>
        </button>

        <button
          class="sketch-btn room-btn"
          id="roomBtn"
          type="button"
          aria-label="打开好友同屏"
          aria-controls="roomPanel"
          aria-expanded="false"
          title="好友同屏"
        >
          <span class="sketch-btn-icon">
            <svg class="ui-icon" data-icon="users" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <path d="M16 3.128a4 4 0 0 1 0 7.744" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <circle cx="9" cy="7" r="4" />
            </svg>
          </span>
          <span class="sketch-btn-text">好友</span>
        </button>

        <button
          class="sketch-btn live2d-switcher-btn"
          id="live2dSwitcherBtn"
          type="button"
          aria-label="切换 Live2D 形象"
          aria-controls="live2dPanel"
          aria-expanded="false"
          title="切换 Live2D 形象"
        >
          <span class="sketch-btn-icon">
            <svg class="ui-icon" data-icon="appearance-sparkles" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
              <circle cx="10" cy="9" r="4" />
              <path d="M4.5 20c1.2-3 3.1-4.5 5.5-4.5s4.3 1.5 5.5 4.5" />
              <path d="M8.4 9h.01" />
              <path d="M11.6 9h.01" />
              <path d="M8.7 11.8c.7.5 1.9.5 2.6 0" />
              <path d="M17.5 3.5v5" />
              <path d="M15 6h5" />
              <path d="M19.5 12v3" />
              <path d="M18 13.5h3" />
            </svg>
          </span>
          <span class="sketch-btn-text">形象</span>
        </button>
      </div>

      <div class="toolbar-utility">
        <button
          class="sketch-btn cat-size-btn"
          id="catSizeBtn"
          type="button"
          aria-label="拖动调整小猫大小"
          title="拖动调整小猫大小"
        >
          <svg class="ui-icon cat-size-icon" data-icon="move-diagonal" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="M11 19H5v-6" />
            <path d="M13 5h6v6" />
            <path d="M19 5 5 19" />
          </svg>
          <span class="sketch-btn-text">大小</span>
        </button>

        <button
          class="sketch-btn settings-btn"
          id="settingsBtn"
          type="button"
          aria-label="打开设置"
          aria-controls="settingsPanel"
          aria-expanded="false"
          title="设置"
        >
          <span class="sketch-btn-icon">
            <svg class="ui-icon" data-icon="settings" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
              <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </span>
          <span class="sketch-btn-text">设置</span>
        </button>
      </div>
    </div>

    <div class="water-reminder-dialog" id="waterReminderDialog" role="dialog" aria-modal="false" aria-labelledby="waterReminderTitle">
      <div class="water-reminder-main">
        <div class="water-reminder-icon" aria-hidden="true">
          <svg class="ui-icon" data-icon="droplet" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z" />
          </svg>
        </div>
        <div class="water-reminder-copy">
          <h3 id="waterReminderTitle">该喝水啦！</h3>
          <p id="waterReminderText">起来活动一下，顺手补一杯水。</p>
        </div>
        <button class="water-reminder-close" id="waterReminderClose" type="button" aria-label="关闭喝水提醒">×</button>
      </div>
      <div class="water-reminder-actions water-reminder-actions-water" id="waterReminderWaterActions">
        <button class="sketch-action-btn" id="waterReminderDrinkBtn" type="button">记录一杯</button>
        <button class="sketch-action-btn sketch-action-btn-snooze" id="waterReminderSnoozeBtn" type="button">稍后提醒</button>
      </div>
      <div class="water-reminder-actions water-reminder-actions-task" id="waterReminderTaskActions">
        <button class="sketch-action-btn water-task-done-btn" id="waterReminderDoneBtn" type="button">完成</button>
        <button class="sketch-action-btn water-task-later-btn" id="waterReminderLaterBtn" type="button">稍后处理</button>
      </div>
    </div>

    <div class="update-prompt" id="updatePrompt" role="dialog" aria-modal="false" aria-labelledby="updatePromptTitle">
      <div class="update-prompt-main">
        <div class="update-prompt-icon" aria-hidden="true">
          <svg class="ui-icon" data-icon="arrow-up" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="m5 12 7-7 7 7" />
            <path d="M12 19V5" />
          </svg>
        </div>
        <div class="update-prompt-copy">
          <h3 id="updatePromptTitle">发现新版本</h3>
          <p id="updatePromptText">desktop-cat 有新版本可用。</p>
        </div>
        <button class="update-prompt-close" id="updatePromptClose" type="button" aria-label="关闭更新提示">×</button>
      </div>
      <div class="update-prompt-actions">
        <button class="sketch-action-btn update-prompt-primary" id="updatePromptPrimary" type="button">下载更新</button>
        <button class="sketch-action-btn sketch-action-btn-snooze" id="updatePromptSecondary" type="button">稍后</button>
      </div>
    </div>

    <div class="water-panel sketch-panel" id="waterPanel">
      <div class="sketch-panel-header sketch-panel-header-water">
        <h3>
          <svg class="ui-icon panel-title-icon" data-icon="droplet" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z" />
          </svg>
          喝水记录
        </h3>
        <button class="sketch-panel-close" id="waterPanelClose" type="button" aria-label="关闭喝水记录">×</button>
      </div>
      <div class="water-panel-body">
        <div class="water-progress-ring" id="waterProgressRing">
          <div class="water-progress-fill"></div>
          <div class="water-progress-inner">
            <span class="water-progress-num" id="waterPanelCount">0</span>
            <span class="water-progress-goal">/10杯</span>
          </div>
        </div>
        <div class="water-panel-actions">
          <div class="water-panel-section-label">喝水提醒</div>
          <div class="water-panel-btns">
            <button class="sketch-action-btn" id="waterPanelDrinkBtn" type="button">
              <svg class="ui-icon action-icon" data-icon="cup-soda" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                <path d="m6 8 1.75 12.28a2 2 0 0 0 2 1.72h4.54a2 2 0 0 0 2-1.72L18 8" />
                <path d="M5 8h14" />
                <path d="M7 15a6.47 6.47 0 0 1 5 0 6.47 6.47 0 0 0 5 0" />
                <path d="m12 8 1-6h2" />
              </svg>
              记录
            </button>
            <button class="sketch-action-btn sketch-action-btn-snooze" id="waterPanelSnoozeBtn" type="button">
              稍后提醒
            </button>
          </div>
          <div class="water-panel-row">
            <span class="water-panel-row-label">喝水提醒</span>
            <label class="sketch-switch">
              <input type="checkbox" id="waterPanelToggle">
              <span class="sketch-switch-slider"></span>
            </label>
          </div>
          <div class="water-panel-row water-panel-row-column">
            <span class="water-panel-row-label">喝水间隔</span>
            <div class="water-panel-intervals" id="waterPanelIntervals">
              <button class="sketch-interval" data-minutes="0.083" type="button">5秒</button>
              <button class="sketch-interval" data-minutes="15" type="button">15m</button>
              <button class="sketch-interval" data-minutes="30" type="button">30m</button>
              <button class="sketch-interval" data-minutes="60" type="button">1h</button>
              <button class="sketch-interval" data-minutes="120" type="button">2h</button>
            </div>
          </div>
          <div class="water-panel-footer">
            <div class="water-panel-last" id="waterPanelLast">尚未提醒</div>
            <div class="water-panel-next" id="waterPanelNext">等待提醒</div>
          </div>
          <div class="water-task-section">
            <div class="water-panel-section-label water-task-section-title">事项提醒</div>
            <div class="water-task-add">
              <label class="water-task-field">
                <span class="water-panel-row-label">事项</span>
                <input id="waterTaskNameInput" class="water-task-input" type="text" maxlength="24" autocomplete="off" placeholder="站起来活动">
              </label>
              <button class="sketch-action-btn water-task-add-btn" id="waterTaskAddBtn" type="button">新增</button>
            </div>
            <label class="water-task-field water-task-time-field">
              <span class="water-panel-row-label">指定时间</span>
              <input id="waterTaskScheduledAtInput" class="water-task-time-input" type="datetime-local" autocomplete="off">
            </label>
            <div class="water-panel-row water-panel-row-column">
              <span class="water-panel-row-label">默认间隔</span>
              <div class="water-panel-intervals water-task-intervals" id="waterTaskNewIntervals">
                <button class="sketch-interval" data-minutes="15" type="button">15m</button>
                <button class="sketch-interval" data-minutes="30" type="button">30m</button>
                <button class="sketch-interval" data-minutes="60" type="button">1h</button>
                <button class="sketch-interval" data-minutes="120" type="button">2h</button>
              </div>
            </div>
            <div class="water-task-list" id="waterTaskList"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="clipboard-panel sketch-panel" id="clipboardPanel">
      <div class="clipboard-panel-header sketch-panel-header sketch-panel-header-clipboard">
        <h3>剪贴板历史</h3>
        <button class="clipboard-panel-close" id="clipboardPanelClose" type="button" aria-label="关闭剪贴板历史">×</button>
      </div>
      <div class="clipboard-panel-actions">
        <button class="clipboard-panel-action" id="clipboardPauseBtn" type="button" aria-pressed="false">暂停</button>
        <button class="clipboard-panel-action" id="clipboardClearBtn" type="button">清空</button>
      </div>
      <div class="sr-only" id="clipboardPanelStatus" aria-live="polite"></div>
      <div class="clipboard-panel-content" id="clipboardPanelContent">
        <!-- 内容将通过 JavaScript 动态加载 -->
      </div>
    </div>

    <div class="room-panel sketch-panel" id="roomPanel">
      <div class="sketch-panel-header sketch-panel-header-room">
        <h3>
          <svg class="ui-icon panel-title-icon" data-icon="users" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <path d="M16 3.128a4 4 0 0 1 0 7.744" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
            <circle cx="9" cy="7" r="4" />
          </svg>
          好友同屏
        </h3>
        <button class="sketch-panel-close" id="roomPanelClose" type="button" aria-label="关闭好友同屏">×</button>
      </div>
      <div class="room-panel-body">
        <div class="room-status-row">
          <span class="room-status-dot" id="roomStatusDot"></span>
          <span class="room-status-text" id="roomStatusText">未连接</span>
          <span class="room-count" id="roomPeerCount">0 在线</span>
        </div>
        <div class="room-current" id="roomCurrent">房间: -</div>
        <div class="room-form">
          <label class="room-field">
            <span>昵称</span>
            <input id="roomNicknameInput" type="text" maxlength="16" autocomplete="off" placeholder="小猫好友">
          </label>
          <label class="room-field">
            <span>房间码</span>
            <input id="roomCodeInput" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="123456">
          </label>
        </div>
        <div class="room-actions">
          <button class="sketch-action-btn" id="roomCreateBtn" type="button">创建</button>
          <button class="sketch-action-btn" id="roomJoinBtn" type="button">加入</button>
          <button class="sketch-action-btn sketch-action-btn-snooze" id="roomLeaveBtn" type="button">退出</button>
        </div>
        <div class="room-error" id="roomError" role="status"></div>
        <div class="room-peer-list" id="roomPeerList"></div>
      </div>
    </div>

    <div class="live2d-panel sketch-panel" id="live2dPanel">
      <div class="sketch-panel-header sketch-panel-header-live2d">
        <h3>
          <svg class="ui-icon panel-title-icon" data-icon="theater" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="M2 10s3-3 3-8" />
            <path d="M22 10s-3-3-3-8" />
            <path d="M10 2c0 4.4-3.6 8-8 8" />
            <path d="M14 2c0 4.4 3.6 8 8 8" />
            <path d="M2 10s2 2 2 5" />
            <path d="M22 10s-2 2-2 5" />
            <path d="M8 15h8" />
            <path d="M2 22v-1a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1" />
            <path d="M14 22v-1a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1" />
          </svg>
          Live2D 形象
        </h3>
        <button class="sketch-panel-close" id="live2dPanelClose" type="button" aria-label="关闭 Live2D 形象">×</button>
      </div>
      <div class="live2d-panel-body">
        <div class="live2d-model-list" id="live2dModelList"></div>
      </div>
    </div>

    <div class="settings-panel sketch-panel" id="settingsPanel">
      <div class="sketch-panel-header sketch-panel-header-settings">
        <h3>
          <svg class="ui-icon panel-title-icon" data-icon="settings" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          设置
        </h3>
        <button class="sketch-panel-close" id="settingsPanelClose" type="button" aria-label="关闭设置">×</button>
      </div>
      <div class="settings-panel-body">
        <div class="settings-section">
          <div class="settings-section-title">陪伴</div>
          <label class="settings-row">
            <span class="settings-row-label">话痨模式</span>
            <span class="sketch-switch">
              <input type="checkbox" id="randomSpeechToggle">
              <span class="sketch-switch-slider"></span>
            </span>
          </label>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">底部按钮</div>
          <label class="settings-row">
            <span class="settings-row-label">喝水</span>
            <span class="sketch-switch">
              <input type="checkbox" data-bottom-button-toggle="water">
              <span class="sketch-switch-slider"></span>
            </span>
          </label>
          <label class="settings-row">
            <span class="settings-row-label">剪贴板</span>
            <span class="sketch-switch">
              <input type="checkbox" data-bottom-button-toggle="clipboard">
              <span class="sketch-switch-slider"></span>
            </span>
          </label>
          <label class="settings-row">
            <span class="settings-row-label">好友</span>
            <span class="sketch-switch">
              <input type="checkbox" data-bottom-button-toggle="room">
              <span class="sketch-switch-slider"></span>
            </span>
          </label>
          <label class="settings-row">
            <span class="settings-row-label">形象</span>
            <span class="sketch-switch">
              <input type="checkbox" data-bottom-button-toggle="live2d">
              <span class="sketch-switch-slider"></span>
            </span>
          </label>
          <label class="settings-row">
            <span class="settings-row-label">大小</span>
            <span class="sketch-switch">
              <input type="checkbox" data-bottom-button-toggle="catSize">
              <span class="sketch-switch-slider"></span>
            </span>
          </label>
        </div>
      </div>
    </div>

    <script src="./vendor/live2d/live2dcubismcore.min.js"></script>
    <script src="./vendor/live2d/pixi.min.js"></script>
    <script src="./vendor/live2d/pixi-live2d-cubism4.min.js"></script>
    <script src="./live2dMotionController.js"></script>
    <script src="./live2dAppearance.js"></script>
    <script src="./live2dPanel.js"></script>
    <script src="./petBehavior.js"></script>
    <script src="./renderer.js"></script>
    <script src="./clipboardPanel.js"></script>
    <script src="./waterPanel.js"></script>
    <script src="./roomPanel.js"></script>
  </body>
</html>
